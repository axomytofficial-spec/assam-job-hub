<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Find government and private job opportunities in Assam.">
<title>Assam Job Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F0;--card:#FFFFFF;--ink:#1B1A17;--muted:#6B6558;--line:#E8E0D2;--red:#B3261E;--gold:#B8841F;--river:#2F4B5A;--soft:#F3EBDC;--on-red:#fff;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130F;--card:#1D1B17;--ink:#F2EDE3;--muted:#A39B8B;--line:#2E2B25;--red:#E0574D;--gold:#D9AC4B;--river:#8FB0C0;--soft:#25221C;--on-red:#14130F}}
:root[data-theme="dark"]{--bg:#14130F;--card:#1D1B17;--ink:#F2EDE3;--muted:#A39B8B;--line:#2E2B25;--red:#E0574D;--gold:#D9AC4B;--river:#8FB0C0;--soft:#25221C;--on-red:#14130F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.weave{height:16px;background:
 linear-gradient(90deg,transparent 0 50%,var(--bg) 50% 100%) 0 5px/8px 6px repeat-x,
 repeating-linear-gradient(90deg,var(--red) 0 22px,var(--gold) 22px 25px,var(--red) 25px 47px,var(--bg) 47px 51px);
 border-bottom:2px solid var(--red)}
header.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font:700 1.3rem/1 var(--serif);letter-spacing:-.2px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.btn{font:700 .95rem var(--sans);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--red);color:var(--on-red);text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.job:focus-visible,.brand:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.hero{padding:34px 0 30px;max-width:760px}
h1{font:700 clamp(2.2rem,7vw,4rem)/1.04 var(--serif);letter-spacing:-1.5px;margin:0 0 16px}
.hero p{color:var(--muted);font-size:1.08rem;max-width:56ch;margin:0}
.live{margin-top:20px;display:flex;gap:18px;flex-wrap:wrap;font-weight:500}
.live b{font:700 1.6rem var(--serif);margin-right:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 18px}
.chip{font:500 .92rem var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.job{background:var(--card);border:1px solid var(--line);border-radius:6px 18px 6px 18px;padding:20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;text-align:left;font:inherit;color:inherit;transition:transform .18s,border-color .18s}
.job:hover{transform:translateY(-3px);border-color:var(--red)}
.jt{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:14px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 1.5rem var(--serif);color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:2.1rem;border-radius:20px}
.job h3{font:700 1.2rem/1.25 var(--serif);margin:0}
.org{color:var(--muted);font-size:.93rem}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.tag{font-size:.82rem;font-weight:700;color:var(--river)}
.left{font-size:.85rem;font-weight:700;background:var(--soft);padding:5px 10px;border-radius:999px}
.left.hot{background:var(--red);color:var(--on-red)}
.sample{font-size:.78rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.note{margin:26px 0 0;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:.92rem;color:var(--muted)}
/* detail */
.back{margin:8px 0 18px}
.dhead{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.dhead h1{font-size:clamp(1.8rem,5.5vw,2.8rem);margin:0 0 4px;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}
.grid div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px 12px 4px 12px;padding:12px 14px}
.grid small{display:block;color:var(--muted);font-size:.85rem}
.grid strong{font-weight:700}
.desc{max-width:66ch;white-space:pre-line;margin:0 0 24px}
h2{font:700 1.3rem var(--serif);margin:26px 0 8px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
footer{margin-top:50px;padding:24px 0 32px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
/* admin */
dialog{border:0;border-radius:18px;padding:0;width:calc(100% - 28px);max-width:600px;background:var(--card);color:var(--ink);box-shadow:0 30px 90px #0006}
dialog::backdrop{background:#000a}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0}
form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}
label{font-size:.88rem;font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
.photo{display:flex;gap:14px;align-items:center}
.photo .av{background:var(--soft);color:var(--muted);font-size:1rem}
.msg{grid-column:1/-1;min-height:1.3em;font-size:.9rem;color:var(--river);font-weight:500;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:500;z-index:9}
.hidden{display:none!important}
@media(max-width:700px){.jobs,.grid,form{grid-template-columns:1fr}.f.full{grid-column:auto}.msg{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

a.job{text-decoration:none}.check{flex-direction:row;align-items:center;gap:8px}.check input{width:auto}
.login{padding:20px;display:flex;flex-direction:column;gap:12px}.who{margin:0;padding:14px 20px 0;color:var(--muted);font-size:.92rem}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}.mrow span{min-width:0}.mrow small{display:block;color:var(--muted)}.btn.small{padding:8px 12px;font-size:.85rem}.btn.del{background:transparent;color:var(--red);border:1px solid var(--red)}
.setup{margin:0 0 18px;padding:12px 14px;border:1px solid var(--gold);border-radius:12px;font-size:.92rem}
</style>
</head>
<body>
<div class="weave" aria-hidden="true"></div>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="index.html" style="text-decoration:none">Assam Job Hub</a>
    <button class="btn ghost" id="adminOpen">Admin</button>
  </header>
  <main id="app"></main>
  <footer>Assam Job Hub is an information directory. Verify every vacancy on the employer’s official website, and never pay anyone to secure a job.</footer>
</div>

<dialog id="dlg">
  <div class="mh"><h2>Admin</h2><button class="btn ghost" id="dlgClose" type="button">Close</button></div>
  <div id="loginPane" class="login">
    <p class="org" style="margin:0">Sign in with the admin account you created in Supabase.</p>
    <div class="f"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="username"></div>
    <div class="f"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" type="button">Sign in</button>
    <p class="msg" id="lmsg" role="status" style="margin:0"></p>
  </div>
  <div id="adminPane" class="hidden">
    <p class="who" id="who"></p>
    <form id="jobForm">
      <div class="f full"><label for="fTitle">Job title</label><input id="fTitle" required maxlength="160"></div>
      <div class="f"><label for="fOrg">Organisation</label><input id="fOrg" required maxlength="160"></div>
      <div class="f"><label for="fCat">Category</label><select id="fCat"></select></div>
      <div class="f full"><label for="fLoc">Location</label><input id="fLoc" value="Assam" maxlength="120"></div>
      <div class="f"><label for="fOpen">Applications open on</label><input id="fOpen" type="date" required></div>
      <div class="f"><label for="fDate">Application deadline</label><input id="fDate" type="date" required></div>
      <div class="f full"><label for="fUrl">Official notice or apply link</label><input id="fUrl" type="url" required placeholder="https://"></div>
      <div class="f full"><label for="fDesc">Description</label><textarea id="fDesc" rows="3" maxlength="1000" placeholder="Eligibility, number of posts, how to apply"></textarea></div>
      <div class="f full"><label for="fPhoto">Job photo or logo</label><div class="photo"><div class="av" id="pv">Photo</div><input id="fPhoto" type="file" accept="image/png,image/jpeg,image/webp"></div></div>
      <div class="f full check"><input id="fPub" type="checkbox" checked><label for="fPub">Publish immediately</label></div>
      <p class="msg" id="msg" role="status"></p>
      <div class="f full"><button class="btn" type="submit" id="saveBtn">Save job</button></div>
      <div class="f full"><button class="btn ghost" type="button" id="logoutBtn">Sign out</button></div>
    </form>
    <div class="login"><h2 style="margin:0">Manage jobs</h2><div id="mlist"></div></div>
  </div>
</dialog>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
// Paste your Supabase Project URL and publishable/anon key below.
const SUPABASE_URL = "https://gocscpbeigbupuxxbxfe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Xns8eRx5mfy_exW31sJr1A_14e_g70e";
// NEVER put a service_role or secret key in this file.
const connected = window.supabase && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
const client = connected ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const COLS = "id,title,organisation,category,location,open_date,deadline,description,official_url,image_url,published";
const CATS=["Government","Private","Teaching","Healthcare","Banking","Engineering","Other"];
const TINTS=["#B3261E","#2F4B5A","#8A6414","#4F6B3A","#6B3A5B","#3B4F8A"];
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const day=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);const p=v=>String(v).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());};
const left=d=>Math.round((new Date(d+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
const openIn=j=>j.open_date?left(j.open_date):0;
const plural=n=>n+(n===1?" day":" days");
const leftText=n=>n<0?"Closed":n===0?"Closes today":n===1?"1 day left":n+" days left";
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}):"Not specified";
const short=d=>d?new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";
function avatar(j,big){const a=el("div","av"+(big?" big":""));
 if(j.image_url){const i=el("img");i.src=j.image_url;i.alt="";i.onerror=()=>{i.remove();a.textContent=ini(j);a.style.background=tint(j);};a.append(i);}
 else{a.textContent=ini(j);a.style.background=tint(j);}return a;}
const ini=j=>(j.organisation||"J").replace(/^Example\s+/i,"").charAt(0).toUpperCase();
const tint=j=>TINTS[(j.organisation||"J").length%TINTS.length];
const sample=[
 {id:"s1",title:"Junior Assistant",organisation:"Example Department of Education",category:"Government",location:"Guwahati",open_date:day(-8),deadline:day(5),official_url:"https://assam.gov.in",description:"Clerical support for district offices.\nGraduate in any stream. Typing proficiency required."},
 {id:"s2",title:"Customer Support Associate",organisation:"Example Tea Co-operative",category:"Private",location:"Dibrugarh",open_date:day(-3),deadline:day(21),official_url:"https://assam.gov.in",description:"Handle buyer queries for a tea marketplace. Assamese and English preferred."},
 {id:"s3",title:"Staff Nurse",organisation:"Example District Hospital",category:"Healthcare",location:"Silchar",open_date:day(4),deadline:day(30),official_url:"https://assam.gov.in",description:"Ward duty across rotating shifts. GNM or B.Sc. Nursing with state registration."}
];
let jobs=[],cat="";
const app=$("app");
function toast(t){const x=$("toast");x.textContent=t;x.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add("hidden"),2600);}
function list(msg){
 app.replaceChildren();
 const open=jobs.filter(j=>left(j.deadline)>=0),soon=open.filter(j=>left(j.deadline)<=7).length;
 const hero=el("section","hero");
 hero.append(el("h1","","Jobs across Assam, checked against the official notice."),el("p","","Government and private vacancies in one place. Each listing links to the employer’s own notification."));
 const live=el("div","live"),a=el("span"),b=el("span");
 a.append(el("b","",open.length),document.createTextNode("open jobs"));b.append(el("b","",soon),document.createTextNode("closing this week"));
 live.append(a,b);hero.append(live);app.append(hero);
 if(msg)app.append(el("div","setup",msg));
 const fl=el("div","filters");fl.setAttribute("role","group");fl.setAttribute("aria-label","Filter by category");
 ["",...CATS].forEach(c=>{const x=el("button","chip",c||"All jobs");x.setAttribute("aria-pressed",String(c===cat));x.onclick=()=>{cat=c;list(msg);};fl.append(x);});
 app.append(fl);
 const g=el("div","jobs");
 const rows=jobs.filter(j=>!cat||j.category===cat).sort((x,y)=>left(x.deadline)-left(y.deadline));
 if(!rows.length)g.append(el("div","empty","No jobs in this category yet."));
 rows.forEach(j=>{
  const c=el("a","job");c.href="job.html?id="+encodeURIComponent(j.id);
  const t=el("div","jt"),w=el("div");w.append(el("h3","",j.title),el("div","org",j.organisation||"Organisation not listed"));t.append(avatar(j),w);
  const f=el("div","facts");f.append(el("span","","Location: "+(j.location||"Assam")),el("span","","Apply: "+(j.open_date?short(j.open_date)+" to ":"until ")+short(j.deadline)),el("span","tag",j.category||"Other"));
  const n=left(j.deadline),no=openIn(j)>0,ft=el("div","foot");
  ft.append(el("span","left"+(!no&&n>=0&&n<=7?" hot":""),no?"Opens in "+plural(openIn(j)):leftText(n)));
  if(String(j.id).startsWith("s"))ft.append(el("span","sample","Sample"));
  c.append(t,f,ft);g.append(c);});
 app.append(g);
}
async function load(){
 if(!client){jobs=sample;list("Setup needed: connect Supabase using README.md. Until then, sample listings are shown.");return;}
 try{
  const {data,error}=await client.from("jobs").select(COLS).eq("published",true).order("created_at",{ascending:false});
  if(error)throw error;jobs=(data||[]).filter(j=>left(j.deadline)>=0);list();
 }catch(e){jobs=sample;list("Database needs attention: "+(e.message||"could not load jobs")+". Sample listings are shown. Check README.md.");}
}
/* admin */
const dlg=$("dlg");let photo=null;
CATS.forEach(c=>{const o=el("option","",c);o.value=c;$("fCat").append(o);});
$("adminOpen").onclick=()=>{$("fOpen").value=day(0);dlg.showModal();};
$("dlgClose").onclick=()=>dlg.close();
async function loadManage(){
 const box=$("mlist");if(!client)return;
 const r=await client.from("jobs").select("id,title,organisation,deadline,published,image_url").order("created_at",{ascending:false});
 box.replaceChildren();
 if(r.error){box.append(el("p","org","Could not load jobs: "+r.error.message));return;}
 if(!r.data.length)box.append(el("p","org","No jobs yet."));
 r.data.forEach(j=>{
  const row=el("div","mrow"),s=el("span"),n=left(j.deadline);
  s.append(el("strong","",j.title),el("small","",(j.organisation||"")+" | "+(n<0?"Closed":"Closes "+short(j.deadline))+(j.published?"":" | Unpublished")));
  const b=el("button","btn small del","Delete");b.type="button";
  b.onclick=async()=>{
   if(!confirm("Delete \""+j.title+"\"? This cannot be undone."))return;
   b.disabled=true;
   const d=await client.from("jobs").delete().eq("id",j.id);
   if(d.error){toast("Could not delete: "+d.error.message);b.disabled=false;return;}
   if(j.image_url&&j.image_url.includes("/job-photos/")){try{await client.storage.from("job-photos").remove([decodeURIComponent(j.image_url.split("/job-photos/")[1])]);}catch(x){}}
   toast("Job deleted");await load();loadManage();
  };
  row.append(s,b);box.append(row);});
}
function showAdmin(u){$("loginPane").classList.toggle("hidden",!!u);$("adminPane").classList.toggle("hidden",!u);if(u)loadManage();if(u)$("who").textContent="Signed in as "+u.email+". Only accounts in admin_users can publish.";}
if(client){client.auth.getSession().then(r=>showAdmin(r.data.session&&r.data.session.user));client.auth.onAuthStateChange((_e,s)=>showAdmin(s&&s.user));}
$("loginBtn").onclick=async()=>{
 if(!client){$("lmsg").textContent="Connect Supabase first (see README.md).";return;}
 const r=await client.auth.signInWithPassword({email:$("aEmail").value.trim(),password:$("aPass").value});
 $("lmsg").textContent=r.error?"Sign-in failed: "+r.error.message:"";if(!r.error)$("aPass").value="";
};
$("logoutBtn").onclick=()=>{if(client)client.auth.signOut();};
function shrink(file){return new Promise((res,rej)=>{
 const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(b=>b?res(b):rej(new Error("Could not process the photo.")),"image/jpeg",.85);};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("That file is not a readable image."));};im.src=u;});}
$("fPhoto").onchange=()=>{
 const f=$("fPhoto").files[0],pv=$("pv");photo=f||null;pv.replaceChildren();pv.textContent="Photo";
 if(f){const i=el("img");i.src=URL.createObjectURL(f);i.alt="Photo preview";pv.textContent="";pv.append(i);}
};
$("jobForm").onsubmit=async e=>{
 e.preventDefault();const m=$("msg");m.textContent="";
 if(!client){m.textContent="Connect Supabase first.";return;}
 let u;try{u=new URL($("fUrl").value.trim());if(!/^https?:$/.test(u.protocol))throw 0;}catch(x){m.textContent="Enter a valid link that starts with http or https.";return;}
 if($("fDate").value<$("fOpen").value){m.textContent="The deadline must be on or after the open date.";return;}
 const p={title:$("fTitle").value.trim(),organisation:$("fOrg").value.trim(),category:$("fCat").value,location:$("fLoc").value.trim()||"Assam",open_date:$("fOpen").value,deadline:$("fDate").value,official_url:u.href,description:$("fDesc").value.trim(),published:$("fPub").checked};
 $("saveBtn").disabled=true;
 try{
  if(photo){
   if(photo.size>10*1024*1024)throw new Error("Photo is too large. Choose one under 10 MB.");
   m.textContent="Uploading photo…";
   const blob=await shrink(photo),path=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+".jpg";
   const up=await client.storage.from("job-photos").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"});
   if(up.error)throw up.error;
   p.image_url=client.storage.from("job-photos").getPublicUrl(path).data.publicUrl;
  }
  const r=await client.from("jobs").insert(p);
  if(r.error)throw r.error;
  $("jobForm").reset();photo=null;$("pv").replaceChildren();$("pv").textContent="Photo";$("fOpen").value=day(0);
  dlg.close();toast("Job saved");await load();loadManage();
 }catch(err){m.textContent="Could not save: "+(err.message||"unknown error")+". Did you run supabase/step2_photos_and_open_date.sql?";}
 $("saveBtn").disabled=false;
};
load();
})();
</script>
</body>
</html>
