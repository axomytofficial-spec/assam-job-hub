color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
svg{display:block}
.ic{display:inline-flex;flex:none}.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1040px;margin:0 auto;padding:0 calc(var(--u)*5.85)}
.serif,.brand,h1,h3,h2,.live b{font-family:var(--serif);font-variant-numeric:lining-nums}
header.bar{border-bottom:1.5px solid #5e4b35;background:var(--bg)}
header.bar .in{max-width:1040px;margin:0 auto;padding:calc(var(--u)*3.4) calc(var(--u)*5.85) calc(var(--u)*1.9);display:flex;align-items:center;gap:calc(var(--u)*4.1)}
.logo{width:calc(var(--u)*7.6);height:calc(var(--u)*13.4);flex:none;background:var(--emblem) center/contain no-repeat;margin-left:calc(var(--u)*-.6)}
.brandbox{flex:1;min-width:0;text-decoration:none;color:var(--ink)}
.brand{display:block;font-weight:700;font-size:calc(var(--u)*6);line-height:1.05;color:var(--cream);letter-spacing:.2px}
.brand b{color:#f1bb69;font-weight:700}
.tagline{display:block;margin-top:calc(var(--u)*1.2);color:#c2bcaf;font-size:calc(var(--u)*2.45);line-height:1.3;max-width:calc(var(--u)*52)}
.menu{flex:none;width:calc(var(--u)*7);height:calc(var(--u)*7);border:0;background:none;color:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;margin-right:calc(var(--u)*-1)}
.menu svg{width:calc(var(--u)*5);height:calc(var(--u)*3.15);stroke:currentColor;stroke-width:4.4;stroke-linecap:round;fill:none}
.btn{font:700 .95rem var(--sans);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--red);color:var(--on-red);text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.job:focus-visible,.brandbox:focus-visible,.menu:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:calc(var(--u)*3.8) 0 0}
.hh{display:flex;gap:calc(var(--u)*3.1)}
.hh i{flex:none;width:calc(var(--u)*.7);border-radius:3px;background:#f1bb69;height:calc(var(--u)*4.4);margin-top:calc(var(--u)*.5)}
h1{font-weight:700;font-size:calc(var(--u)*5);line-height:1.2;margin:0 0 calc(var(--u)*1.3);color:var(--cream)}
.hh p{margin:0;color:var(--muted);font-size:calc(var(--u)*2.75);line-height:1.5;max-width:calc(var(--u)*80)}
.live{margin-top:calc(var(--u)*3.2);display:flex;align-items:center;gap:calc(var(--u)*3.7);padding-left:calc(var(--u)*1)}
.live .s{display:flex;align-items:center;gap:calc(var(--u)*3.2)}
.live .ic{width:calc(var(--u)*5);height:calc(var(--u)*5);color:var(--gold)}
.live b{font-weight:700;font-size:calc(var(--u)*6);line-height:1;color:var(--cream)}
.live .l{color:#efe6d3;font-size:calc(var(--u)*2.9);margin-left:calc(var(--u)*-.6)}
.filters{display:flex;gap:calc(var(--u)*2.4) calc(var(--u)*1.5);flex-wrap:wrap;margin:calc(var(--u)*4) 0 calc(var(--u)*2.9)}

.tw tr:last-child td{border-bottom:0}.tw th:last-child,.tw td:last-child{border-right:0}

@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<header class="bar"><div class="in"><span class="logo" role="img" aria-label="Government of Assam emblem"></span><a class="brandbox" href="index.html"><span class="brand">Assam <b>Job Hub</b></span><span class="tagline">Your Gateway to Government &amp; Private Jobs in Assam</span></a><a class="btn ghost" href="index.html">All jobs</a></div></header>
<div class="wrap">
  <main id="app"><p class="org">Loading job details…</p></main>
  <footer><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3Z"/><path d="M12 8.5v7M8.5 12h7"/></svg></span><p>Assam Job Hub is an information directory. Verify every vacancy on the employer’s official website, and never pay anyone to secure a job.</p></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
// Paste the same Supabase Project URL and publishable/anon key as in index.html.
const SUPABASE_URL = "https://gocscpbeigbupuxxbxfe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Xns8eRx5mfy_exW31sJr1A_14e_g70e";
// NEVER put a service_role or secret key in this file.
const connected = window.supabase && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
const client = connected ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const COLS = "id,title,organisation,category,location,open_date,deadline,description,official_url,image_url,published";
const CATS=["Government","Private","Teaching","Healthcare","Banking","Engineering","Other"];
const TINTS=["#B3261E","#2F4B5A","#8A6414","#4F6B3A","#6B3A5B","#3B4F8A"];
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const day=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);const p=v=>String(v).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());};
const left=d=>Math.round((new Date(d+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
const openIn=j=>j.open_date?left(j.open_date):0;
const plural=n=>n+(n===1?" day":" days");
const leftText=n=>n<0?"Closed":n===0?"Closes today":n===1?"1 day left":n+" days left";
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}):"Not specified";
const short=d=>d?new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";
function avatar(j,big){const a=el("div","av"+(big?" big":""));
 if(j.image_url){const i=el("img");i.src=j.image_url;i.alt="";i.onerror=()=>{i.remove();fallback(a,j);};a.append(i);}
 else fallback(a,j);return a;}
function fallback(a,j){if(j.category==="Government"){a.classList.add("emblem");a.textContent="";a.style.background="";}else{a.textContent=ini(j);a.style.background=tint(j);}}
const ini=j=>(j.organisation||"J").replace(/^Example\s+/i,"").charAt(0).toUpperCase();
const tint=j=>TINTS[(j.organisation||"J").length%TINTS.length];
const sample=[
 {id:"s1",title:"Junior Assistant",organisation:"Example Department of Education",category:"Government",location:"Guwahati",open_date:day(-8),deadline:day(5),official_url:"https://assam.gov.in",description:"Clerical support for district offices.\nGraduate in any stream. Typing proficiency required."},
 {id:"s2",title:"Customer Support Associate",organisation:"Example Tea Co-operative",category:"Private",location:"Dibrugarh",open_date:day(-3),deadline:day(21),official_url:"https://assam.gov.in",description:"Handle buyer queries for a tea marketplace. Assamese and English preferred."},
 {id:"s3",title:"Staff Nurse",organisation:"Example District Hospital",category:"Healthcare",location:"Silchar",open_date:day(4),deadline:day(30),official_url:"https://assam.gov.in",description:"Ward duty across rotating shifts. GNM or B.Sc. Nursing with state registration."}
];
const app=$("app");

function link(p,label,url){const a=el("a","",label);a.href=url;a.target="_blank";a.rel="noopener noreferrer nofollow";p.append(a);}
function inline(p,text){
 const re=/(\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s<]+)/g;let last=0,m;
 while((m=re.exec(text))){
  if(m.index>last)p.append(document.createTextNode(text.slice(last,m.index)));
  let t=m[0];
  if(t.startsWith("**")){p.append(el("strong","",t.slice(2,-2)));last=m.index+t.length;}
  else if(t.startsWith("[")){const k=t.indexOf("](");link(p,t.slice(1,k),t.slice(k+2,-1));last=m.index+t.length;}
  else{t=t.replace(/[.,;:!?)]+$/,"");link(p,t,t);last=m.index+t.length;re.lastIndex=last;}
 }
 if(last<text.length)p.append(document.createTextNode(text.slice(last)));
}
const SEP=/^\|?[\s:|-]+\|?$/;
function table(rows){
 const cells=r=>r.replace(/^\|/,"").replace(/\|$/,"").split("|").map(s=>s.trim());
 const head=rows.length>1&&SEP.test(rows[1]);
 const data=rows.filter(r=>!SEP.test(r)).map(cells);
 const w=el("div","tw"),t=el("table");
 data.forEach((r,ri)=>{const tr=el("tr");r.forEach((c,ci)=>{const d=el(head&&ri===0?"th":"td",!head&&ci===0&&r.length===2?"k":"");inline(d,c);tr.append(d);});t.append(tr);});
 w.append(t);return w;
}
function rich(src){
 const box=el("div","rich"),L=(src||"").replace(/\r/g,"").split("\n");let i=0,para=[];
 const flush=()=>{if(para.length){const p=el("p");inline(p,para.join(" "));box.append(p);para=[];}};
 const UL=/^[-*\u2022]\s+/,OL=/^\d+[.)]\s+/;
 while(i<L.length){
  const ln=L[i].trim();let m;
  if(!ln){flush();i++;continue;}
  if((m=ln.match(/^(#{1,3})\s+(.*)$/))){flush();box.append(el(m[1].length<3?"h2":"h3","",m[2]));i++;continue;}
  if(ln.startsWith("|")){flush();const rows=[];while(i<L.length&&L[i].trim().startsWith("|")){rows.push(L[i].trim());i++;}box.append(table(rows));continue;}
  if(UL.test(ln)||OL.test(ln)){flush();const ord=OL.test(ln),R=ord?OL:UL,list=el(ord?"ol":"ul");
   while(i<L.length&&R.test(L[i].trim())){const li=el("li");inline(li,L[i].trim().replace(R,""));list.append(li);i++;}box.append(list);continue;}
  if((m=ln.match(/^([A-Za-z][^:|]{1,38}):\s+(.+)$/))&&!/^https?$/i.test(m[1])){flush();const p=el("p","kv");p.append(el("strong","",m[1]+": "));inline(p,m[2]);box.append(p);i++;continue;}
  para.push(ln);i++;
 }
 flush();return box;
}
function fail(t){app.replaceChildren();app.append(el("div","note",t));const b=el("a","btn","Back to all jobs");b.href="index.html";b.style.marginTop="16px";app.append(b);}
function show(j){
 document.title=j.title+" | Assam Job Hub";app.replaceChildren();
 const back=el("a","btn ghost back","Back to all jobs");back.href="index.html";
 const h=el("div","dhead"),w=el("div");w.append(el("h1","",j.title),el("div","org",j.organisation||"Organisation not listed"));h.append(avatar(j,1),w);
 const n=left(j.deadline),gr=el("div","grid");
 [["Category",j.category||"Other"],["Location",j.location||"Assam"],
  ["Applications open",fmt(j.open_date)+(openIn(j)>0?" (opens in "+plural(openIn(j))+")":"")],
  ["Application deadline",fmt(j.deadline)+" ("+leftText(n).toLowerCase()+")"]].forEach(r=>{const d=el("div");d.append(el("small","",r[0]),el("strong","",r[1]));gr.append(d);});
 const ap=el("a","btn",openIn(j)>0?"Read the official notice":"Open official notice and apply");ap.href=j.official_url;ap.target="_blank";ap.rel="noopener noreferrer";
 if(n<0){ap.textContent="This job has closed";ap.removeAttribute("href");ap.style.opacity=".6";ap.style.pointerEvents="none";}
 const cta=el("div","cta");cta.append(ap);
 const sh=el("a","btn ghost","Share on WhatsApp");sh.href="https://wa.me/?text="+encodeURIComponent(j.title+" - "+location.href);sh.target="_blank";sh.rel="noopener noreferrer";cta.append(sh);
 const body=j.description&&j.description.trim()?rich(j.description):el("p","note","No further details were provided. Check the official notice.");
 const cta2=cta.cloneNode(true);cta2.style.marginTop="18px";
 app.append(back,h,gr,cta,body,cta2,el("p","note","Check the eligibility and closing date on the official notice before you apply."));
}
async function load(){
 const id=new URLSearchParams(location.search).get("id");
 if(!id){fail("No job selected.");return;}
 if(!client){const j=sample.find(x=>x.id===id);j?show(j):fail("Job not found.");return;}
 try{
  const r=await client.from("jobs").select(COLS).eq("id",id).eq("published",true).maybeSingle();
  if(r.error)throw r.error;
  r.data?show(r.data):fail("This job was not found or is no longer published.");
 }catch(e){fail("Could not load this job: "+(e.message||"database error"));}
}
load();
})();
</script>
